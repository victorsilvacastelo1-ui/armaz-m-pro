<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Armazém Pro</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#102142,#245cf5);color:#17202a;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(760px,100%);background:#fff;border-radius:22px;padding:34px;box-shadow:0 25px 70px rgba(0,0,0,.28)}
    h1{margin:0 0 8px;font-size:38px}.blue{color:#245cf5}.sub{color:#667085;margin-bottom:26px}
    .field{display:grid;gap:7px;margin-bottom:20px}.field label{font-weight:700}.field input{padding:14px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px}
    .plans{display:grid;grid-template-columns:1fr 1fr;gap:18px}.plan{border:1px solid #e4e7ec;border-radius:16px;padding:22px}
    .price{font-size:30px;font-weight:800;margin:8px 0 16px}.btn{width:100%;border:0;border-radius:10px;padding:14px;cursor:pointer;font-weight:800;font-size:15px;background:#245cf5;color:#fff}.btn.alt{background:#159447}.btn:disabled{opacity:.6;cursor:not-allowed}
    .msg{margin-top:18px;padding:12px;border-radius:10px;display:none;white-space:pre-wrap}.msg.show{display:block}.msg.err{background:#fee4e2;color:#912018}.msg.ok{background:#dcfae6;color:#05603a}
    .note{font-size:13px;color:#667085;margin-top:20px;line-height:1.45}
    @media(max-width:650px){.plans{grid-template-columns:1fr}h1{font-size:31px}.card{padding:24px}}
  </style>
</head>
<body>
  <main class="card">
    <h1>ARMAZÉM <span class="blue">PRO</span></h1>
    <p class="sub">Controle profissional de estoque, entradas, saídas, devoluções, kits e relatórios.</p>
    <div class="plans">
      <article class="plan">
        <h2>Plano mensal</h2><div class="price">R$ 10/mês</div>
        <button class="btn" onclick="abrirPagamento('https://mpago.la/1TGVCFW')">Assinar com Mercado Pago</button>
      </article>
      <article class="plan">
        <h2>Acesso vitalício</h2><div class="price">R$ 110</div>
        <button class="btn alt" onclick="abrirPagamento('https://mpago.la/1j8Mw4w')">Comprar com Mercado Pago</button>
      </article>
    </div>
    <p class="note">Após a aprovação, o Mercado Pago deverá retornar para a página de acesso ao ARMAZÉM PRO.</p>
  </main>
<script>
function abrirPagamento(link){
  window.location.href = link;
}
</script>
</body>
</html>
